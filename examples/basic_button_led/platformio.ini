; PlatformIO configuration for basic_button_led example
;
; Usage:
;   pio run                    — build for ESP32
;   pio run -t upload          — flash to device
;   pio run -t monitor         — open serial monitor
;   pio test                   — run native tests

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8

; Include the library from parent directory
lib_extra_dirs = ../../

build_flags =
    -I include
    -D WIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -D WIFI_PASSWORD=\"${sysenv.WIFI_PASSWORD}\"
    -D MQTT_BROKER_HOST=\"${sysenv.MQTT_BROKER_HOST}\"

[env:native]
platform = native
test_framework = unity

build_flags =
    -std=c++17
    -I ../../src
