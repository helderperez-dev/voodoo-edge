; Voodoo Edge — PlatformIO Library Configuration
;
; This is a reusable SDK for connecting physical devices to the Voodoo Runtime.
; It provides protocol, transport, and hardware abstractions for embedded devices.

[platformio]
src_dir = src
lib_dir = .
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DVOODOO_EDGE_LOG_LEVEL=3

[env:native]
platform = native
build_flags =
    -DVOODOO_EDGE_NATIVE_TEST
    -DVOODOO_EDGE_PROTOCOL_VERSION='"1"'
    -DVOODOO_EDGE_FIRMWARE_VERSION='"1.0.0"'
test_filter = test_*
